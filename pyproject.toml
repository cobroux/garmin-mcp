[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server exposing Garmin Connect data (activities, sleep, heart rate, stress, body composition) to MCP clients such as Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2.0.0",
    "garminconnect>=0.2.24",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-api = "garmin_mcp.http_api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]
